# Builds and uploads ims.sso to PyPI, chained after the "main" workflow.
#
# Trigger: workflow_run — fires when a run of the workflow named "main"
# (main.yml) finishes. The job below then requires that the run fully
# succeeded (lint, test and docs included, because update-version has
# needs: [lint, test, docs]) AND that it ran on release_test, which is the
# only branch where update-version runs at all. So: merge into release_test,
# pipeline green, version bumped/tagged/pushed by update-version, then this
# workflow checks out that release commit, builds it and publishes it.
#
# Publishing uses the EXISTING PyPI trusted publisher, which is registered for
# the workflow FILE "publish.yml" + environment "pypi" — renaming this file
# (or dropping the environment below) breaks uploads with "invalid-publisher".
#
# NOTE: a workflow_run trigger is only read from the copy of this file on the
#       repo's DEFAULT branch — keep this version merged to `main`.

name: Upload Python Package

on:
  workflow_run:
    workflows: ["main"]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # whole "main" run green (lint, test, docs, update-version) AND it was the
    # release branch — update-version only runs there
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'release_test'
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/ims.sso
    steps:
      # NOT head_sha: that is the commit which TRIGGERED main.yml, while the
      # release commit (version bump + changelog) is created during the run —
      # the release_test tip is that release commit once the run has finished
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_branch }}

      # guards against someone merging to release_test between the run ending
      # and this workflow starting: fail loudly instead of shipping wrong code
      - name: Verify release commit
        run: |
          TAG=$(git tag --points-at HEAD | head -1)
          SUBJECT=$(git log -1 --format=%s)
          if [ -z "$TAG" ] || [ "$SUBJECT" != "release for $TAG [skip ci]" ]; then
            echo "::error::release_test tip is not a release commit (got: $SUBJECT)"
            exit 1
          fi
          echo "Publishing $TAG"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Set up Python
        run: uv python install

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          build: false
          packages-dir: dist/
