# Uploads ims.sso to PyPI after the "main" workflow (main.yml) completes.
# Only runs when that run fully succeeded on release_test — i.e. after its
# update-version job built the release and pushed the commit/tag. The wheels
# come from that run's "release-dists" artifact, so nothing is rebuilt here.
#
# NOTE 1: workflow_run triggers only fire for the copy of this file that lives
#         on the repo's DEFAULT branch — merge this version to `main` for it
#         to ever run.
# NOTE 2: uses a PyPI API token stored as the repo secret PYPI_API_TOKEN
#         (Settings → Secrets and variables → Actions), so no PyPI-side
#         trusted-publisher entry is required.

name: Upload Python Package

on:
  workflow_run:
    workflows: ["main"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # whole "main" run green (lint, test, docs, update-version) AND it was the
    # release branch — update-version only runs there
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'release_test'
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          build: false
          packages-dir: dist/
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
