# Uploads ims.sso to PyPI after the "main" workflow (main.yml) completes.
# Only runs when that run fully succeeded on release_test — i.e. after its
# update-version job built the release and pushed the commit/tag. The wheels
# come from that run's "release-dists" artifact, so nothing is rebuilt here.
#
# Uses the EXISTING trusted publisher on PyPI (workflow name
# "Upload Python Package" + environment "pypi") — do NOT rename this workflow
# or the publisher stops matching.
#
# NOTE: workflow_run triggers only fire for the copy of this file that lives
#       on the repo's DEFAULT branch — merge this version to `main` for it
#       to ever run.

name: Upload Python Package

on:
  workflow_run:
    workflows: ["main"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # whole "main" run green (lint, test, docs, update-version) AND it was the
    # release branch — update-version only runs there
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'release_test'
    permissions:
      contents: read
      actions: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/ims.sso
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          build: false
          packages-dir: dist/
