name: main

on: [push]

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
    - name: Set up Python
      run: uv python install
    - name: Install dependencies
      run: |
        uv sync --all-extras --dev
        uv pip install ruff
    - name: Ruff
      uses: astral-sh/ruff-action@v4.0.0
      with:
        args: "format --check --diff"
    - name: Check for towncrier change file
      if: github.ref != 'refs/heads/main'
      run: |
        fragments=$(find changes -type f ! -name '.gitkeep')
        if [ -z "$fragments" ]; then
          echo "::error::No news fragments found. Add a towncrier change file (e.g. changes/<issue-number>.bugfix) before merging."
          exit 1
        fi
        echo "Found change file(s):"
        echo "$fragments"

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
    - name: Set up Python
      run: uv python install
    - name: Install dependencies
      run: |
        uv sync --all-extras
    - name: Run unittests
      run: |
        uv run pytest --cov=src --cov-report=html

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
    - name: Set up Python
      run: uv python install
    - name: Install dependencies
      run: |
        uv sync --all-extras
    - name: Sphinx build
      run: |
        uv run sphinx-build docs _build

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      with:
        publish_branch: gh-pages
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: _build
        force_orphan: true

  update-version:
    runs-on: ubuntu-latest
    # only runs after lint, test and docs have all succeeded
    needs: [lint, test, docs]
    if: github.ref == 'refs/heads/release_test'
    permissions:
      contents: write
      id-token: write
    environment:
      name: pypi
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Set up Python
        run: uv python install

      - name: Install release tools
        run: |
          uv venv
          # make hatch/towncrier available to the later steps
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
          uv pip install .[build]
          uv pip install hatch towncrier

      - name: Bump version and build changelog
        run: |
          CURRENT=$(hatch version)
          if [[ "$CURRENT" =~ ^(.+a)([0-9]+)$ ]]; then
            # already an alpha (e.g. 1.1.6a1) -> bump the alpha counter: 1.1.6a1 -> 1.1.6a2
            NEXT="${BASH_REMATCH[1]}$(( ${BASH_REMATCH[2]} + 1 ))"
          else
            # Segment based on the towncrier fragment types in changes/:
            # bugfix/docs/chore -> patch, feature -> minor, breaking -> major
            SEGMENT=patch
            ls changes/*.bugfix >/dev/null 2>&1 && SEGMENT=patch
            ls changes/*.feature >/dev/null 2>&1 && SEGMENT=minor
            ls changes/*.breaking >/dev/null 2>&1 && SEGMENT=major
            # compute the next stable version without writing it: hatch refuses      
            # to set 1.1.6a1 after 1.1.6 has already been written                    
            IFS=. read -r MAJOR MINOR PATCH <<<"$CURRENT"                            
            case "$SEGMENT" in                                                       
              major) NEXT="$((MAJOR + 1)).0.0" ;;                                    
              minor) NEXT="$MAJOR.$((MINOR + 1)).0" ;;                               
              *)     NEXT="$MAJOR.$MINOR.$((PATCH + 1))" ;;                          
            esac                                                                     
            # first alpha of the next stable version: 1.1.6 -> 1.1.6a1               
            NEXT="${NEXT}a1"                                                         
          fi
          hatch version "$NEXT"
          # set PKG_VERSION for this step ($GITHUB_ENV only affects later steps)
          export PKG_VERSION="$NEXT"
          echo "PKG_VERSION=$NEXT" >> $GITHUB_ENV
          towncrier build --yes --version $PKG_VERSION

      - name: Pre-release check
        run: |
          # equivalent of: imsplone prerelease_check <package> <version>
          if git rev-parse -q --verify "refs/tags/${PKG_VERSION}" >/dev/null; then
            echo "::error::Tag already exists: ${PKG_VERSION}"
            exit 1
          fi
          if curl -fsSL "https://pypi.org/pypi/${{ github.event.repository.name }}/${PKG_VERSION}/json" >/dev/null; then
            echo "::error::Package already released: ${{ github.event.repository.name }} - ${PKG_VERSION}"
            exit 1
          fi

      - name: Commit and tag release
        run: |
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git config user.name "${{ github.actor }}"
          git add .
          git commit -m "release for $PKG_VERSION [skip ci]"
          git tag -a ${PKG_VERSION} -m "creating tag ${PKG_VERSION}"

      - name: Push release commit and tag
        run: |
          git push origin HEAD:release_test
          git push origin ${PKG_VERSION}

  release-build:
    runs-on: ubuntu-latest
    needs:
      - update-version
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build release distributions
        run: |
          # NOTE: put your own distribution build steps here.
          python -m pip install build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    # Dedicated environments with protections for publishing are strongly recommended.
    # For more information, see: https://docs.github.com/en/actions/deployment/targeting-different-environments/using-environments-for-deployment#deployment-protection-rules
    environment:
      name: pypi
      # OPTIONAL: uncomment and update to include your PyPI project URL in the deployment status:
      url: https://pypi.org/p/ims.sso
      #
      # ALTERNATIVE: if your GitHub Release name is the PyPI project version string
      # ALTERNATIVE: exactly, uncomment the following line instead:
      # url: https://pypi.org/project/YOURPROJECT/${{ github.event.release.name }}

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/